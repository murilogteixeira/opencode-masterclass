            "03 Criando plugins": "03 Creating plugins"
            "04 Busca web": "04 Web search"
            "05 Contexto: referências e anexos": "05 Context: references & attachments"
            "01 run e sessões": "01 run & sessions"
            "02 CI/CD": "02 CI/CD"
            "03 Workflows e boas práticas": "03 Workflows & best practices"
            "01 HTTP API": "01 HTTP API"
            "02 Cliente JavaScript": "02 JavaScript client"
            "03 SDK, Effect e Cloudflare": "03 SDK, Effect & Cloudflare"
