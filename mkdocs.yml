site_name: OpenCode Masterclass
site_description: Curso completo de OpenCode (V2) — do básico ao avançado (32 aulas, 6 módulos + projetos)
site_url: https://murilogteixeira.github.io/opencode-masterclass/
repo_url: https://github.com/murilogteixeira/opencode-masterclass
repo_name: murilogteixeira/opencode-masterclass
edit_uri: edit/main/

# O site é montado em site-content/ por scripts/build-docs.sh (preserva links relativos)
docs_dir: site-content
site_dir: site

theme:
  name: material
  language: pt
  logo: assets/banner.svg
  favicon: assets/banner.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search:
      lang: pt
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: pt
          name: Português
          default: true
        - locale: en
          name: English
          nav_translations:
            "Início": "Home"
            "Comece aqui": "Start here"
            "Trilha de estudo": "Study path"
            "Glossário": "Glossary"
