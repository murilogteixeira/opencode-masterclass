            "Como contribuir": "Contributing"
            "Módulo 01 — Fundamentos": "Module 01 — Fundamentals"
            "Módulo 02 — Personalização": "Module 02 — Customization"
            "Módulo 03 — Avançado": "Module 03 — Advanced"
            "Módulo 04 — Automação e CI/CD": "Module 04 — Automation & CI/CD"
            "Módulo 05 — Integração": "Module 05 — Integration"
            "Módulo 06 — Operação e Enterprise": "Module 06 — Operations & Enterprise"
            "Projetos finais": "Capstone projects"
            "Visão geral": "Overview"
            "01 Introdução ao OpenCode": "01 Introduction to OpenCode"
            "02 Setup e Instalação": "02 Setup & Installation"
            "03 A TUI: sessões e keybinds": "03 The TUI: sessions & keybinds"
            "04 Configuração e CLI settings": "04 Configuration & CLI settings"
            "05 Modelos e Providers": "05 Models & Providers"
            "01 Instruções e Prompts": "01 Instructions & Prompts"
            "02 Comandos": "02 Commands"
            "03 Permissões e Policies": "03 Permissions & Policies"
            "04 Ferramentas": "04 Tools"
