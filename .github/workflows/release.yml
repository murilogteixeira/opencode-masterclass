name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Criar release a partir da tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gerar notas e publicar release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
