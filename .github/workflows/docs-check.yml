name: Docs check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Instalar MkDocs Material
        run: pip install -r requirements.txt

      - name: Montar o site (preserva links relativos)
        run: bash scripts/build-docs.sh

      - name: Build do MkDocs
        run: mkdocs build
